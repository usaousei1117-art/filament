<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フィラメント管理</title>

  <!-- PWA / Web App 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="フィラメント">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 pb-20">

  <!-- ヘッダー -->
  <header class="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold">C</div>
      <h1 class="text-xl font-bold">フィラメント管理</h1>
    </div>
  </header>

  <!-- ダッシュボード -->
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
      <p class="text-xs text-slate-400 font-medium">総スプール数</p>
      <p id="totalCount" class="text-2xl font-bold mt-1">0</p>
    </div>
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
      <p class="text-xs text-slate-400 font-medium">低残量 (&lt;200g)</p>
      <p id="lowCount" class="text-2xl font-bold text-amber-500 mt-1">0</p>
    </div>
  </div>

  <!-- 検索・フィルター -->
  <div class="space-y-3 mb-6">
    <div class="flex gap-2">
      <button class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium">すべて</button>
      <button class="bg-slate-800 text-slate-300 px-4 py-1.5 rounded-lg text-sm font-medium border border-slate-700">OK</button>
    </div>
    <input type="text" placeholder="名前・素材・カラーで検索..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
  </div>

  <!-- メインコンテンツ領域 -->
  <main id="filamentList" class="space-y-3">
    <div class="text-center py-12 text-slate-500 text-sm">
      条件に該当するフィラメントがありません
    </div>
  </main>

  <!-- Service Worker 登録スクリプト -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker 登録成功:', reg.scope))
          .catch(err => console.error('Service Worker 登録失敗:', err));
      });
    }
  </script>
</body>
</html>
